name: VisionPlayground scaffolds

on:
  workflow_dispatch:
  push:
    paths:
      - 'SceneFlow/**'
      - 'DocLens/**'
      - 'InspectLab/**'
      - 'MeasureLab/**'
      - 'FrameFind/**'
      - 'RedactLab/**'
      - 'scripts/**'
      - '.ruff.toml'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/scaffolds.yml'
  pull_request:
    paths:
      - 'SceneFlow/**'
      - 'DocLens/**'
      - 'InspectLab/**'
      - 'MeasureLab/**'
      - 'FrameFind/**'
      - 'RedactLab/**'
      - 'scripts/**'
      - '.ruff.toml'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/scaffolds.yml'

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            SceneFlow/requirements-lock.txt
            DocLens/requirements-lock.txt
            InspectLab/requirements-lock.txt
            MeasureLab/requirements-lock.txt
            FrameFind/requirements-lock.txt
            RedactLab/requirements-lock.txt
      - name: Build and test six independent installations
        run: python scripts/check_scaffolds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaffold-results-${{ matrix.os }}-py${{ matrix.python }}
          path: build/scaffolds/
          if-no-files-found: warn

